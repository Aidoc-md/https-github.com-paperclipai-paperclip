<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — The Linen House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow" id="shop-eyebrow">The collection</span>
        <h1 id="shop-title" style="font-size:clamp(2.4rem,5vw,3.8rem)">Shop all</h1>
        <p id="shop-sub">Pure linen, thoughtfully made.</p>
      </div>
    </section>
    <div class="wrap">
      <nav class="filters" id="filters" aria-label="Filter products"></nav>
      <div class="product-grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
      <div style="height:100px"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const { api, productCard, bindCards, Wishlist, CATEGORY_NAMES, esc } = TLH;
      const params = new URLSearchParams(location.search);
      const category = params.get('category');
      const filter = params.get('filter');
      const q = params.get('q');

      const copy = {
        women: ['Women', 'Dresses, shirts and co-ords cut from breathable linen.'],
        men: ['Men', 'Relaxed shirts, kurtas and trousers for warm days.'],
        fabrics: ['Fabrics', 'Pre-washed pure linen, sold by the metre.'],
        accessories: ['Accessories', 'Totes, scarves and hats to finish the look.'],
        new: ['New Arrivals', 'Fresh from the studio this season.'],
        wishlist: ['Your Wishlist', 'Pieces you have saved for later.'],
      };
      const key = category || filter;
      if (q) {
        document.getElementById('shop-eyebrow').textContent = 'Search';
        document.getElementById('shop-title').textContent = `“${q}”`;
        document.getElementById('shop-sub').textContent = 'Search results';
      } else if (copy[key]) {
        document.getElementById('shop-title').textContent = copy[key][0];
        document.getElementById('shop-sub').textContent = copy[key][1];
      }
      document.title = `${q ? 'Search' : (copy[key]?.[0] || 'Shop')} — The Linen House`;

      const chips = [['All', '/shop', !key && !q], ...Object.entries(CATEGORY_NAMES).map(([s, n]) => [n, `/shop?category=${s}`, category === s]), ['New Arrivals', '/shop?filter=new', filter === 'new'], ['Wishlist', '/shop?filter=wishlist', filter === 'wishlist']];
      document.getElementById('filters').innerHTML = chips.map(([n, h, a]) => `<a class="chip ${a ? 'active' : ''}" href="${h}">${n}</a>`).join('');

      const qs = new URLSearchParams();
      if (category) qs.set('category', category);
      if (filter === 'new') qs.set('isNew', 'true');
      if (q) qs.set('q', q);
      let list = await api('/api/products?' + qs);
      if (filter === 'wishlist') list = list.filter((p) => Wishlist.has(p.id));

      const grid = document.getElementById('grid');
      if (!list.length) {
        const empty = document.getElementById('empty');
        empty.hidden = false;
        empty.innerHTML = filter === 'wishlist'
          ? '<h3>Your wishlist is empty</h3><p>Tap the heart on any piece to save it here.</p><a class="btn" href="/shop">Browse the collection</a>'
          : `<h3>Nothing found</h3><p>We couldn't find anything for ${q ? '“' + esc(q) + '”' : 'this selection'}.</p><a class="btn" href="/shop">View all products</a>`;
        return;
      }
      grid.innerHTML = list.map(productCard).join('');
      bindCards(grid, list);
      // Remove un-hearted items live on the wishlist view
      if (filter === 'wishlist') grid.addEventListener('click', (e) => {
        const w = e.target.closest('[data-wish]');
        if (w && !w.classList.contains('on')) setTimeout(() => location.reload(), 600);
      });
    })();
  </script>
</body>
</html>
